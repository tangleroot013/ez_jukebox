# ez_jukebox mpd config - EDIT music_directory once the consolidated
# library location is finalized (do not point this at ~/Music yet -
# that symlink currently resolves to ChromeOS Downloads).
music_directory    "~/Music-library"
playlist_directory "~/.config/mpd/playlists"
db_file            "~/.config/mpd/database"
log_file           "~/.config/mpd/log"
pid_file           "~/.config/mpd/pid"
state_file         "~/.config/mpd/state"
sticker_file       "~/.config/mpd/sticker.sql"

audio_output {
    type "pulse"
    name "ChromeOS Pulse Output"
}

auto_update "yes"
