# ez_jukebox mpd config - EDIT music_directory once the consolidated
# library location is finalized (do not point this at ~/Music yet -
# that symlink currently resolves to ChromeOS Downloads).
music_directory    "~/Music-library"
playlist_directory "~/.config/mpd/playlists"
db_file            "~/.config/mpd/database"
log_file           "~/.config/mpd/log"
pid_file           "~/.config/mpd/pid"
state_file         "~/.config/mpd/state"
sticker_file       "~/.config/mpd/sticker.sql"

audio_output {
    type "pulse"
    name "ChromeOS Pulse Output"
    # The setup script adds the user-specific native Pulse/PipeWire socket.
}

# Keep library scans out of the playback process. Run `mpc update` after
# importing or deleting music rather than spending CPU scanning continuously.
auto_update "no"

# Preserve loudness metadata without forcing destructive normalization.
replaygain "auto"
replaygain_preamp "0"
replaygain_missing_preamp "0"
replaygain_limit "yes"
volume_normalization "no"

# Buffering absorbs Crostini scheduling jitter without changing source data.
max_output_buffer_size "16384"

resampler {
    plugin "internal"
}
